<title id="title">Codex Multi-Cloud MCP Integration Architecture</title><desc id="desc">OpenAI Codex connects through separately configured MCP servers to Microsoft Azure and AWS. AWS and Azure skills supply guidance. Read-only discovery verified both cloud connections. Terraform and specialist agents are future work.</desc>
